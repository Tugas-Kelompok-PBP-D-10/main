{% extends 'base.html' %}
{% load static %}

{% block meta %}
<title>Inventori | OlahRasa</title>
{% endblock meta %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'inventori/css/inventori-style.css' %}">
{% endblock %}

{% block content %}
<!-- Untuk menampilkan pesan sukses dan error -->
<div id="messages">
    <p id="message-success" class="message"></p>
    <p id="message-error" class="message"></p>
</div>


<div id="content">
    <h1>Inventori</h1>
    <h2>Rekomendasi Resep</h2>

    <!-- Tempat menampung data bahan -->
    <div id="bahan-grid">
        <table id="bahan-table">

        </table>
    </div>

    <!-- Tempat menampung rekomendasi resep -->
    <div id="recipe-grid">
        <p>Coming Soon</p>
    </div>

    <!-- Tempat meletakkan tombol + dan Update Inventori -->
    <div class="buttons">
        <button type="button"
                id="add-button"
                class="button"
                popovertarget="tambah-bahan-modal">
            <span aria-hidden="true">+</span>    
        </button>
        <a href="{% url 'update_inventori' %}" class="href-button">Update Inventori</a>
    </div>
</div>

<!-- Komponen popup tambah bahan dan backdrop blur -->
<div class="blur-backdrop" id="backdrop"></div>
{% include "components/tambah_bahan_modal.html" %}

<script>
    // Setup awal (hide backdrop blur dan pesan error serta sukses)
    document.getElementById('backdrop').hidden = true;
    document.getElementById('messages').style.display = 'none';

    // Membuat elemen <tr> untuk suatu objek Bahan
    function buildBahanCard(bahan) {
        const elem = document.createElement('tr');
        elem.className = "bahan-card";
        elem.innerHTML = '';

        elem.innerHTML = `
            <td>${bahan.nama}</td>
            <td>${bahan.stok}</td>
        `;
        return elem;
    }

    // Mengambil data bahan dalam bentuk json, kemudian
    // menyisipkan datanya ke dalam tabel bahan pada halaman html.
    async function fetchBahan() {
        const bahanGrid = document.getElementById('bahan-table');

        // Fetch data Bahan
        const url = "{% url 'get_bahan_json' %}";
        const response = await fetch(url, {
            headers: {'Accept': 'application/json'},
        });

        // Parsing respons JSON jadi array Bahan
        const bahanData = await response.json();

        bahanGrid.innerHTML = '';
        if (bahanData.length === 0) { // Tidak ada bahan dalam inventori
            bahanGrid.innerHTML = '<p>Tidak ada bahan dalam inventori</p>';
        } else { // Ada bahan dalam inventori
            // Tampilkan table head
            bahanGrid.innerHTML = `
            <tr>
                <th>Nama Bahan</th>
                <th>Stok</th>
            </tr>
            `;
            // Buat dan append table row untuk setiap objek Bahan
            bahanData.forEach(bahan => {
                bahanGrid.appendChild(buildBahanCard(bahan));
            });
        }
    }

    // Menutup popup Tambah Bahan
    function closeBahanModal() {
        document.getElementById("tambah-bahan-modal").hidePopover();
        document.getElementById('backdrop').hidden = true;
    }

    // Fungsi untuk membantu mengambil token csrf pada cookie
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // Mendefinisikan url dan elemen popup untuk tambah bahan
    const TAMBAH_BAHAN_ENDPOINT = "{% url 'add_bahan' %}";
    const bahanForm = document.getElementById('tambah-bahan-form');

    // Implementasi penambahan bahan tanpa page reload
    async function addBahan(event) {
        event.preventDefault();

        const submitButton = bahanForm.querySelector('button[type="submit"]');
        submitButton.disabled = true;

        try {
            // Kirim POST request
            const response = await fetch(TAMBAH_BAHAN_ENDPOINT, {
                method: 'POST',
                headers: { 'X-CSRFToken': getCookie('csrftoken') },
                body: new FormData(bahanForm),
            });
            const result = await response.json().catch(() => ({}));

            if (response.ok) { // Bahan berhasil ditambahkan
                bahanForm.reset(); // Kosongkan form tambah bahan
                closeBahanModal(); // Tutup popup tambah bahan
                fetchBahan(); // Ambil serta load kembali data bahan
                showMessage('message-success', 'message-error', 'Bahan berhasil ditambahkan!');
            } else { // Bahan gagal ditambahkan
                showMessage('message-error', 'message-success', 'Gagal menambahkan bahan. Pastikan stok tidak kurang dari 1.');
            }
        } catch (error) {
            console.error('Error menambahkan bahan:', error);
        } finally {
            submitButton.disabled = false;
        }
    }

    // Fungsi untuk toggle visibility pesan
    function showMessage(toShow, toHide, message) {
        document.getElementById('messages').style.display = 'flex';
        document.getElementById(toHide).hidden = true;
        document.getElementById(toShow).innerHTML = message;
        setTimeout(() => {
            document.getElementById('messages').style.display = 'none';
            document.getElementById(toHide).hidden = false;
        }, 3000);
    }

    // Mendeteksi pengumpulan form tambah bahan
    if (bahanForm) {
        bahanForm.addEventListener('submit', addBahan);
    }

    // Fungsi untuk toggle visibility popup tambah bahan serta backdropnya
    function showPopup() {
        document.getElementById('backdrop').hidden = false;
        document.getElementById('tambah-bahan-modal').hidden = false;
    }

    function hidePopup() {
        document.getElementById('backdrop').hidden = true;
        document.getElementById('tambah-bahan-modal').hidden = true;
    }
    
    // Munculkan popup saat tombol + diklik
    document.getElementById('add-button').addEventListener('click', () => {
        showPopup();
    });

    // Tutup popup ketika backdrop diklik
    document.getElementById('backdrop').addEventListener('click', () => {
        hidePopup();
    });

    // Fetch dan load data Bahan ke halaman saat pertama kali dibuka
    fetchBahan();

</script>
{% endblock content %}
