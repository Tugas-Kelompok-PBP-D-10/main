<div id="tambah-bahan-modal"
     class="form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true">
    
    <div class="form-modal__content">
        <h3>Tambah Bahan</h3>
        <button type="button"
                popovertarget="tambah-bahan-modal"
                popovertargetaction="hide">×</button>
        
        <form id="tambah-bahan-form"
              method="post"
              class="form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}  
            <div class="form-modal__actions">
                <button type="button"
                        popovertarget="tambah-bahan-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit">Tambah</button>
            </div>  
        </form>
    </div>
</div>
