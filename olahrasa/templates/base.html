<!-- templates/base.html -->
{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}OlahRasa{% endblock %}</title>

    <!-- CSS Utama -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block meta %}{% endblock %}

    <!-- CSS khusus halaman -->
    {% block extra_css %}
    <link rel="stylesheet" href="{% static 'voting/voting.css' %}">
    {% endblock %}
</head>

<body>

    <!-- NAVBAR OLAHRASA -->
    <nav class="olahrasa-navbar">
        <div class="olahrasa-navbar-inner">

            
            <a href="#" class="olahrasa-navbar-brand">
                <img
                    src="{% static 'images/Olahrasa.png' %}"
                    alt=""
                    class="olahrasa-navbar-logo"
                >

                <span class="olahrasa-brand-text">
                    OlahRasa
                </span>
            </a>


            <!-- Mobile Menu Toggle -->
            <button
                type="button"
                class="olahrasa-menu-toggle"
                id="olahrasa-menu-toggle"
                aria-label="Buka menu navigasi"
                aria-controls="olahrasa-nav-links"
                aria-expanded="false"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- Desktop & Mobile Navigation -->
            
            <div class="olahrasa-nav-links" id="olahrasa-nav-links">

                <a href="#">
                    Home
                </a>

                <a href="#">
                    Inventory
                </a>

                <a href="#">
                    Recipe
                </a>

                <a
                    href="/tracker/"
                    class="{% if request.path == '/tracker/' %}active{% endif %}"
                    {% if request.path == '/tracker/' %}aria-current="page"{% endif %}
                >
                    Tracker
                </a>

                <a href="#" class="olahrasa-nav-cta">
                    Get Started
                </a>

            </div>
        </div>
    </nav>

    <!-- KONTEN HALAMAN -->
    <div class="container">
        {% block content %}
        {% endblock content %}
    </div>

    <!-- FOOTER OLAHRASA -->
        <footer class="olahrasa-footer">
            <div class="olahrasa-footer-inner">

                <div class="olahrasa-footer-brand">
                    <img
                        src="{% static 'images/Olahrasa.png' %}"
                        alt=""
                        class="olahrasa-footer-logo"
                    >

                    <span class="olahrasa-footer-brand-text">
                        OlahRasa
                    </span>
                </div>

                <p class="olahrasa-footer-credit">
                    @ Kelompok 10 PBP-D Fasilkom UI
                </p>

            </div>
        </footer>


                </div>
            </footer>

    <!-- MOBILE NAVIGATION -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const toggle = document.getElementById("olahrasa-menu-toggle");
            const links = document.getElementById("olahrasa-nav-links");

            if (!toggle || !links) return;

            toggle.addEventListener("click", function () {
                const isOpen = links.classList.toggle("is-open");

                toggle.setAttribute(
                    "aria-expanded",
                    String(isOpen)
                );

                toggle.setAttribute(
                    "aria-label",
                    isOpen
                        ? "Tutup menu navigasi"
                        : "Buka menu navigasi"
                );
            });

            links.querySelectorAll("a").forEach(function (link) {
                link.addEventListener("click", function () {
                    links.classList.remove("is-open");
                    toggle.setAttribute("aria-expanded", "false");
                    toggle.setAttribute(
                        "aria-label",
                        "Buka menu navigasi"
                    );
                });
            });
        });
    </script>

    <script src="{% static 'voting/voting.js' %}" defer></script>

</body>
</html>
